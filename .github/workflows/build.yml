name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app_src/**'
      - 'test_src/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project shell
        run: flutter create --org com.example --project-name sweep_app --platforms=android,ios .

      # audioplayers is not pinned yet: run once, read its version in the
      # "Show package versions" step, then pin it here like the other two.
      - name: Add packages
        run: flutter pub add flutter_blue_plus:2.3.15 permission_handler:13.0.2 audioplayers

      - name: Use our app code
        run: |
          cp -r app_src/. lib/
          rm -f test/widget_test.dart
          mkdir -p test
          cp -r test_src/. test/

      - name: Add Bluetooth permissions (Android)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <application#' $MANIFEST

      - name: Raise compileSdk to 37
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Show package versions
        run: flutter pub deps --style=compact | grep -E "(flutter_blue_plus|permission_handler|audioplayers) " || true

      - name: Analyze code
        run: flutter analyze --no-fatal-infos lib test

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: sweep-apk
          path: build/app/outputs/flutter-apk/app-release.apk
