
name: Build Sweep Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Select APK type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'app_src/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'

permissions:
  contents: read

concurrency:
  group: sweep-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Create Flutter project shell
        run: |
          flutter create --org com.example --project-name sweep_app --platforms=android,ios .

      - name: Install Android SDK 37 preview
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --channel=3 \
            "platforms;android-37.0"

      - name: Add packages
        run: |
          flutter pub add flutter_blue_plus permission_handler

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Use our app code
        run: |
          cp app_src/main.dart lib/main.dart

      - name: Configure Bluetooth permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <application#' "$MANIFEST"

      - name: Configure Android compile SDK
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 37/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --${BUILD_TYPE}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ env.BUILD_TYPE }}-apk
          path: build/app/outputs/flutter-apk/app-${{ env.BUILD_TYPE }}.apk
          if-no-files-found: error
          retention-days: 14
