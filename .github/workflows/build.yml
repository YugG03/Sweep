
name: Build Sweep Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Select APK type
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: sweep-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Create Flutter project shell
        run: |
          flutter create --org com.example --project-name sweep_app --platforms=android,ios .

      - name: Install Android SDK 37
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" \
              -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-37"

      - name: Add packages
        run: |
          flutter pub add flutter_blue_plus permission_handler

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Use our app code
        run: |
          cp app_src/main.dart lib/main.dart

      - name: Configure Bluetooth permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          sed -i 's#<application#<uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <application#' "$MANIFEST"

      - name: Configure Android compile SDK
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 37/' android/app/build.gradle.kts
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --${{ inputs.build_type }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ inputs.build_type }}-apk
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_type }}.apk
          if-no-files-found: error
          retention-days: 14
